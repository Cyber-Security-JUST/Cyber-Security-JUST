<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020617" />
            <stop offset="50%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>

        <!-- Cyber Grid Pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
        </pattern>

        <!-- Shield Gradient -->
        <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#00f6ff" />
            <stop offset="100%" stop-color="#5d00ff" />
        </linearGradient>

        <linearGradient id="shield-inner" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#020617" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>

        <!-- Glow Effects -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="25" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.7"/>
        </filter>

        <!-- The Wavy Shape -->
        <clipPath id="bg-clip">
            <path d="M0 0 L1000 0 L1000 260 Q750 320 500 260 T0 260 Z" />
        </clipPath>
    </defs>

    <!-- Apply Background & Clip -->
    <g clip-path="url(#bg-clip)">
        <rect width="1000" height="300" fill="url(#bg-grad)" />
        <rect width="1000" height="300" fill="url(#grid)" />

        <!-- Ambient Glows -->
        <circle cx="150" cy="150" r="150" fill="#38bdf8" opacity="0.15" filter="url(#glow-heavy)" />
        <circle cx="850" cy="150" r="150" fill="#c084fc" opacity="0.15" filter="url(#glow-heavy)" />

        <!-- Center Shield Graphic -->
        <g transform="translate(500, 85) scale(1.1)">
            <!-- Outer Glowing Shield -->
            <path d="M0 -45 L35 -30 L35 15 C35 45 15 65 0 80 C-15 65 -35 45 -35 15 L-35 -30 Z" 
                  fill="none" stroke="url(#shield-grad)" stroke-width="2.5" filter="url(#glow)" class="shield-pulse"/>
            <!-- Inner Shield Base -->
            <path d="M0 -38 L28 -26 L28 14 C28 38 12 55 0 68 C-12 55 -28 38 -28 14 L-28 -26 Z" 
                  fill="url(#shield-inner)" stroke="url(#shield-grad)" stroke-width="1.5"/>
            <!-- Lock icon inside -->
            <rect x="-10" y="-5" width="20" height="15" rx="3" fill="#00f6ff" filter="url(#glow)" />
            <path d="M-6 -5 V-11 C-6 -15 6 -15 6 -11 V-5" fill="none" stroke="#00f6ff" stroke-width="2.5" />
            <circle cx="0" cy="2" r="2.5" fill="#1e1b4b" />
            <path d="M-1.5 2 L1.5 2 L2 7 L-2 7 Z" fill="#1e1b4b" />
        </g>
    </g>

    <!-- Animated Particles (Outside clip so they can overlap edges nicely if needed) -->
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
            50% { transform: translateY(-15px) scale(1.5); opacity: 0.8; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        .p1 { animation: float 4s ease-in-out infinite; }
        .p2 { animation: float 6s ease-in-out infinite 1s; }
        .p3 { animation: float 5s ease-in-out infinite 2s; }
        .p4 { animation: float 7s ease-in-out infinite 1.5s; }
        .shield-pulse { animation: pulse 3s infinite ease-in-out; transform-origin: center; }
    </style>

    <g fill="#38bdf8">
        <circle cx="100" cy="180" r="2" class="p1" />
        <circle cx="850" cy="200" r="3" class="p2" />
        <circle cx="300" cy="70" r="2" class="p3" />
        <circle cx="750" cy="90" r="1.5" class="p4" />
        <circle cx="50" cy="110" r="2.5" class="p3" />
        <circle cx="920" cy="140" r="2" class="p1" />
        <circle cx="400" cy="160" r="1" class="p4" />
        <circle cx="600" cy="180" r="2" class="p2" />
    </g>

    <!-- Typography -->
    <!-- Crisp text with clean neon shadow -->
    <text x="500" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#text-glow)">
        CYBERSECURITY LAB
    </text>


</svg>
