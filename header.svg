<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f1e" />
            <stop offset="25%" stop-color="#1e3a5f" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="75%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#00d4ff" />
        </linearGradient>
        
        <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#0a0f1e" />
        </linearGradient>

        <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0a0f1e" />
            <stop offset="33%" stop-color="#1e3a5f" />
            <stop offset="66%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#00d4ff" />
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <style>
        @keyframes twinkle {
            0%, 100% { opacity: 0.1; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        .star { fill: #ffffff; animation: twinkle 4s infinite ease-in-out; transform-origin: center; }
        .s1 { animation-delay: 0s; }
        .s2 { animation-delay: 0.7s; }
        .s3 { animation-delay: 1.4s; }
        .s4 { animation-delay: 2.1s; }
        .s5 { animation-delay: 2.8s; }
        .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
        .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #e2e8f0; letter-spacing: 1px; }
    </style>

    <!-- Wave 1 (Back) -->
    <path d="M0,0 L1000,0 L1000,200 C800,280 500,130 0,240 Z" fill="url(#grad2)" opacity="0.5" />
    
    <!-- Wave 2 (Middle) -->
    <path d="M0,0 L1000,0 L1000,220 C700,160 300,280 0,180 Z" fill="url(#grad3)" opacity="0.6" />
    
    <!-- Wave 3 (Front) -->
    <path d="M0,0 L1000,0 L1000,230 C750,290 400,170 0,220 Z" fill="url(#grad1)" />

    <!-- Twinkling Stars -->
    <g>
        <circle cx="150" cy="60" r="2.5" class="star s1" />
        <circle cx="850" cy="90" r="3" class="star s2" />
        <circle cx="280" cy="140" r="1.5" class="star s3" />
        <circle cx="720" cy="50" r="2" class="star s4" />
        <circle cx="920" cy="180" r="1.5" class="star s5" />
        <circle cx="80" cy="160" r="2" class="star s2" />
        <circle cx="450" cy="40" r="2.5" class="star s1" />
        <circle cx="580" cy="130" r="1.5" class="star s4" />
        <circle cx="350" cy="80" r="2" class="star s5" />
        <circle cx="800" cy="150" r="2" class="star s3" />
    </g>

    <!-- Content -->
    <text x="500" y="115" class="title" text-anchor="middle" filter="url(#shadow)">
        🛡️ CyberSecurity Lab
    </text>
    <text x="500" y="165" class="subtitle" text-anchor="middle" filter="url(#shadow)">
        Jashore University of Science &amp; Technology
    </text>
</svg>
