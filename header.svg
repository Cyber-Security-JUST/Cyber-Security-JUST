<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#697686" />
            <stop offset="50%" stop-color="#76b1f9" />
            <stop offset="100%" stop-color="#bdafff" />
        </linearGradient>
        
        <!-- Shield Gradients -->
        <linearGradient id="shieldBase" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>
        <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        
        <!-- Shadows -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
        </filter>
        <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
        </filter>
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bg)" />
    
    <!-- Shield Icon centered with text -->
    <g transform="translate(180, 75)" filter="url(#shieldShadow)">
        <!-- Outer border (gray/silver) -->
        <path d="M45 0 L0 18 L0 50 C0 75 18 95 45 110 C72 95 90 75 90 50 L90 18 Z" fill="url(#shieldBase)" />
        <!-- Left half of inner shield -->
        <path d="M45 5 L5 21 L5 50 C5 72 20 89 45 102 Z" fill="url(#shieldLeft)" />
        <!-- Right half of inner shield -->
        <path d="M45 5 L85 21 L85 50 C85 72 70 89 45 102 Z" fill="url(#shieldRight)" />
        <!-- Gloss highlight -->
        <path d="M45 5 L81 19 L81 50 C81 69 68 84 45 96 Z" fill="#93c5fd" opacity="0.6"/>
    </g>

    <!-- Text -->
    <text x="300" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="900" fill="#ffffff" filter="url(#shadow)">
        CyberSecurity Lab
    </text>
</svg>
